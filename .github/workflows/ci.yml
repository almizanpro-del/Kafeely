name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — feedback for the newest commit wins.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint + TypeScript)
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
